# Offline tests for first-party tools. Includes the synology-extras CHECKED_AGAINST tripwire
# (docs/vetting/synology-mcp-upgrades.md): an upgrade of the Synology MCP fails here until overlap is rechecked.
# No secrets, no network access to any device.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: synology-extras
        run: python3 -I tools/synology-extras/test_server.py -v
